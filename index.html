<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <section class= "columna_formulario">

            <header>
                <label>Formulario de Registro</label>
            </header>

            <main>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ej: Ana">
                    <p id="errorNombre" class="error"></p>
                </div>

                <div class="campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Ej: Millaqueo">
                    <p id="errorApellido" class="error"></p>
                </div>

                <div class="campo">
                    <label for="cargo">Cargo</label>
                    <input type="text" id="cargo" placeholder="Ej: Colaborador">
                    <p id="errorCargo" class="error"></p>
                </div>

                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="text" id="correo" placeholder="Ej: alguien@empresa.cl">
                    <p id="errorCorreo" class="error"></p>
                </div>

            </main>

            <button id="btnEnviar">Enviar</button>

            <footer>
                <label>Empresa CL ©Derechos reservados</label>
            </footer>
        </section>

        <section class="columna_datos">
            <div class="tarjeta_datos" id="tarjetaDatos">
                <header class="header_datos">Colaboradores Registrados</header>
                <div id="listaColaboradores">
                    <div class="zona_filtro">
                        <label for="filtro">Buscar:</label>
                        <input type="text" id="inputFiltro" placeholder="Filtrar por nombre, apellido o cargo">
                    </div>

                    <table class="tabla_sql" id="tablaColaboradores">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Cargo</th>
                                <th>Correo</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <!-- Aquí se agregarán los colaboradores registrados -->
                        </tbody>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
