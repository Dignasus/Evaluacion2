<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <label>Formulario de Registro</label>
    </header>

    <main>
        <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ej: Ana">
            <p id="error-nombre" class="error"></p>
          </div>

        <div class="campo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" placeholder="Ej: Millaqueo">
            <p id="error-apellido" class="error"></p>
        </div>

        <div class="campo">
            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" placeholder="Ej: Colaborador">
        </div>

        <div class="campo">
            <label for="correo">Correo</label>
            <input type="text" id="correo" placeholder="Ej: alguien@empresa.cl">
            <p id="error-correo" class="error"></p>
        </div>

    </main>

    <button id="btnEnviar">Enviar</button>

    <footer>
        <label>Empresa CL ©Derechos reservados</label>
    </footer>
</body>
<script src="script.js"></script>
</html>
